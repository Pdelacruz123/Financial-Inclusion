# Countries (ISO3 codes) and World Bank indicator codes to load.
# Default: the 20 Latin American countries. Aggregates (WLD, LCN, ...) are not allowed.
countries:
  - ARG  # Argentina
  - BOL  # Bolivia
  - BRA  # Brazil
  - CHL  # Chile
  - COL  # Colombia
  - CRI  # Costa Rica
  - CUB  # Cuba
  - DOM  # Dominican Republic
  - ECU  # Ecuador
  - SLV  # El Salvador
  - GTM  # Guatemala
  - HTI  # Haiti
  - HND  # Honduras
  - MEX  # Mexico
  - NIC  # Nicaragua
  - PAN  # Panama
  - PRY  # Paraguay
  - PER  # Peru (example country for the control-value tests)
  - URY  # Uruguay
  - VEN  # Venezuela

# World Bank code: short label (official names are long; this label is what reports show).
indicators:
  FX.OWN.TOTL.ZS: "Account ownership, all adults (%)"    # Findex, triennial
  FX.OWN.TOTL.FE.ZS: "Account ownership, women (%)"
  FX.OWN.TOTL.40.ZS: "Account ownership, poorest 40% (%)"
  FB.CBK.BRCH.P5: "Bank branches per 100,000 adults"      # IMF FAS
  FB.ATM.TOTL.P5: "ATMs per 100,000 adults"               # IMF FAS
  IT.CEL.SETS.P2: "Mobile subscriptions per 100 people"   # ITU
  IT.NET.USER.ZS: "Internet users (% of population)"      # ITU
  FS.AST.PRVT.GD.ZS: "Private credit (% of GDP)"          # not FD.AST.PRVT.GD.ZS, "by banks"
  NY.GDP.PCAP.CD: "GDP per capita (current US$)"
